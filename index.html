<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1850">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oxidationstal">
<link rel="manifest" href="manifest.webmanifest">

<style>html{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Oxidationstal Træner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: telefon-app i én kolonne (max 480px, centreret på pc). Tre faner i en svævende lys menu i bunden. Spørgsmål fylder hele skærmen uden menu. */
:root {
  --ink: #FFFFFF; --soft: #C6C5F0; --faint: #A3A2DC;
  --bg: #1A1850; --glow-a: #4B40B4; --glow-b: #2B3A9C;
  --ac: #33DDE8; --ac-ink: #0A2748;
  --surf: rgba(255,255,255,.08); --surf-2: rgba(255,255,255,.14); --line: rgba(255,255,255,.12);
  --pill: #FFFFFF; --pill-ink: #1B1A4D; --pill-hover: #EEEDFB;
  --nav: rgba(255,255,255,.94); --nav-ink: #4A4980;
  --ok: #1B8F4E; --ok-bg: #E1F7E9; --bad: #C93434; --bad-bg: #FDE7E7; --card-ink: #1B1A4D;
  --paper: #D9D3C5; --marker: #17181A;
  --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --hand: 'Permanent Marker', 'Segoe Print', 'Bradley Hand', cursive;
  color-scheme: dark;
}
:root[data-skin="mint"] { --bg: #0B2928; --glow-a: #1B8A72; --glow-b: #145A70; --ac: #7CF2B0; --ac-ink: #06301E; --nav-ink: #2F5A52; }
:root[data-skin="sunset"] { --bg: #2A1536; --glow-a: #B8427C; --glow-b: #5B2B9A; --ac: #FFB26B; --ac-ink: #3A1D08; --nav-ink: #6A4A74; }
:root[data-skin="neon"] { --bg: #0E0E13; --glow-a: #2B2B3A; --glow-b: #1B1B26; --ac: #C6FF3D; --ac-ink: #1B2600; --nav-ink: #4A4A5A; }
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(70% 40% at 90% 0%, var(--glow-a) 0%, transparent 70%), radial-gradient(60% 40% at 0% 100%, var(--glow-b) 0%, transparent 70%);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; font-weight: 600;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--ac); outline-offset: 2px; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
sub, sup { line-height: 0; }
h1, h2, h3, p { margin: 0; }

/* Faner */
.screen { display: flex; flex-direction: column; gap: 14px; padding-block: 22px 134px; }
.head { display: flex; align-items: center; gap: 12px; }
.head svg { width: 46px; height: auto; flex: none; }
.head h1 { font-size: 28px; font-weight: 900; line-height: 1.05; letter-spacing: -0.01em; }
.head p { color: var(--soft); font-size: 14px; font-weight: 700; }
.sec { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 800; margin-top: 8px; }
.surf { background: var(--surf); border: 1px solid var(--line); border-radius: 26px; padding: 18px; }

.big-go { position: relative; overflow: hidden; width: 100%; text-align: left; background: var(--ac); color: var(--ac-ink); border-radius: 28px; padding: 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 14px 34px rgba(0,0,0,.28); }
.big-go::after { content: ""; position: absolute; right: -30px; top: -40px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.28); }
.big-go b { display: block; font-size: 24px; font-weight: 900; line-height: 1.1; }
.big-go span { font-size: 14px; font-weight: 700; opacity: .8; }
.big-go .play { position: relative; z-index: 1; flex: none; width: 54px; height: 54px; border-radius: 50%; background: var(--ac-ink); color: var(--ac); display: grid; place-items: center; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { text-align: left; background: var(--surf); border: 1px solid var(--line); border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 2px; min-height: 96px; justify-content: flex-end; }
.tile b { font-size: 19px; font-weight: 900; }
.tile span { font-size: 13px; color: var(--soft); font-weight: 700; }
.tile:hover:not([disabled]) { background: var(--surf-2); }
.tile[disabled] { opacity: .45; cursor: default; }
.tile .n { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 6px; color: var(--ac); }
.topics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.topic { text-align: left; background: var(--surf); border: 1px solid var(--line); border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; }
.topic b { font-size: 15px; font-weight: 800; line-height: 1.2; }
.topic span { font-size: 13px; color: var(--soft); font-weight: 700; font-variant-numeric: tabular-nums; }
.topic:hover { background: var(--surf-2); }

.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surf); border: 1px solid var(--line); border-radius: 22px; padding: 14px; }
.stat b { display: block; font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--ac); }
.stat span { font-size: 12px; color: var(--soft); font-weight: 800; }
.hm { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
.hm i { font-style: normal; text-align: center; font-size: 11px; color: var(--faint); font-weight: 800; }
.hm button { aspect-ratio: 1; border-radius: 10px; background: rgba(255,255,255,.07); }
.hm button.fut { opacity: .25; cursor: default; }
.hm button.l1 { background: color-mix(in srgb, var(--ac) 30%, transparent); }
.hm button.l2 { background: color-mix(in srgb, var(--ac) 55%, transparent); }
.hm button.l3 { background: color-mix(in srgb, var(--ac) 80%, transparent); }
.hm button.l4 { background: var(--ac); }
.hm button.on { outline: 2px solid #fff; outline-offset: 1px; }
.hmcap { margin-top: 12px; font-size: 14px; color: var(--soft); font-weight: 700; min-height: 21px; }
.bars { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.bar-row .t { display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; margin-bottom: 5px; }
.bar-row .t span { color: var(--soft); font-variant-numeric: tabular-nums; }
.track { height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--ac); border-radius: 99px; }
.fixes { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.fix { background: rgba(255,255,255,.07); border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fix .f { font-weight: 900; font-size: 18px; }
.fix .s { font-size: 12px; color: var(--soft); font-weight: 700; }
.fix .a { font-weight: 900; font-size: 18px; color: var(--ac); font-variant-numeric: tabular-nums; }
.empty { color: var(--soft); font-size: 14px; margin-top: 10px; }
.go { width: 100%; margin-top: 14px; min-height: 50px; border-radius: 16px; background: var(--ac); color: var(--ac-ink); font-weight: 900; }

.skins { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
.skin { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--soft); }
.skin i { width: 100%; max-width: 64px; aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; display: block; }
.skin.on { color: #fff; } .skin.on i { border-color: #fff; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: rgba(255,255,255,.07); border-radius: 18px; padding: 5px; margin-top: 12px; }
.seg button { min-height: 44px; border-radius: 14px; font-weight: 900; color: var(--soft); }
.seg button.on { background: var(--ac); color: var(--ac-ink); }
.lenrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surf); border: 1px solid var(--line); border-radius: 22px; padding: 8px 8px 8px 16px; }
.lenrow > span { font-size: 14px; font-weight: 800; color: var(--soft); }
.lenrow .seg { margin-top: 0; width: 168px; flex: none; }
.lenrow .seg button { min-height: 40px; }
.danger { width: 100%; margin-top: 12px; min-height: 50px; border-radius: 16px; font-weight: 900; background: rgba(255,255,255,.08); }
.danger.sure { background: var(--bad); color: #fff; }
.note-s { font-size: 13px; color: var(--soft); margin-top: 10px; font-weight: 700; }

/* Hjælpeark */
.hint { text-align: left; width: 100%; background: var(--surf); border: 1px dashed var(--ac); border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; }
.hint b { font-weight: 900; font-size: 16px; color: var(--ac); }
.hint span { font-size: 13px; color: var(--soft); font-weight: 700; }
.steps { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; font-weight: 700; }
.steps li::before { content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ac); color: var(--ac-ink); display: grid; place-items: center; font-weight: 900; font-size: 14px; }
.steps li span { padding-top: 1px; }
.wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
.tbl th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 800; padding: 6px 6px 6px 0; }
.tbl td { padding: 9px 6px 9px 0; border-top: 1px solid var(--line); vertical-align: top; font-weight: 700; }
.tbl td.ox { font-weight: 900; color: var(--ac); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl td.at { font-weight: 900; white-space: nowrap; }
.tbl td:last-child { color: var(--soft); padding-right: 0; }
.ex { background: rgba(255,255,255,.07); border-radius: 18px; padding: 12px 14px; margin-top: 10px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ex small { display: block; color: var(--soft); font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.en { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.en div { display: grid; grid-template-columns: 30px 44px 1fr; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; padding: 3px 6px; border-radius: 10px; }
.en div b { font-weight: 900; }
.en div span { color: var(--soft); text-align: right; }
.en div i { display: block; height: 8px; border-radius: 99px; background: var(--ac); opacity: .55; }
.en div.h { background: rgba(255,255,255,.12); }
.en div.h i { opacity: 1; }
.lead { color: var(--soft); font-size: 14px; font-weight: 700; margin-top: 8px; }
.oxr { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; font-weight: 700; }
.oxr b { color: var(--ac); font-weight: 900; font-variant-numeric: tabular-nums; }
.eltitle { font-size: 18px; font-weight: 900; margin: 0 0 4px; }
.eltitle small { color: var(--soft); font-size: 13px; font-weight: 700; margin-left: 6px; }
.tips { margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px; }
.tips sub, .ex sub, .tbl sub, .oxr sub { font-size: .75em; }

/* Svævende menu */
.nav { position: fixed; left: 50%; transform: translateX(-50%); touch-action: none; user-select: none; -webkit-user-select: none; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(calc(100% - 32px), 440px); z-index: 20; background: var(--nav); border-radius: 30px; padding: 7px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 8px; border-radius: 24px; color: var(--nav-ink); font-size: 12px; font-weight: 800; }
.nav button { position: relative; z-index: 1; transition: color .15s; }
.nav button.on, .nav button.hot { color: var(--ac-ink); }
.nav button svg { transition: transform .22s cubic-bezier(.34,1.56,.64,1); }
.nav button.hot svg { transform: scale(1.22) translateY(-2px); }
.nav .ind { position: absolute; top: 7px; bottom: 7px; left: 0; width: 0; border-radius: 24px; background: var(--ac); pointer-events: none; z-index: 0;
  transform: translateX(var(--x, 7px)) scale(var(--s, 1)); transition: transform .45s cubic-bezier(.34,1.45,.5,1);
  box-shadow: 0 6px 18px color-mix(in srgb, var(--ac) 40%, transparent); }
.nav.grab .ind { --s: 1.07; transition: transform .1s linear; }
.nav.init .ind { transition: none; }
.screen.enter { animation: slidein .28s cubic-bezier(.2,.8,.2,1); }
@keyframes slidein { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 28px)); } to { opacity: 1; transform: none; } }


/* Spørgsmål */
.stage { display: flex; flex-direction: column; flex: 1; }
.qtop { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding-block: 16px 12px; }
.timer { justify-self: start; display: inline-flex; align-items: center; gap: 6px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--soft); }
.qnum { color: var(--soft); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.x { justify-self: end; width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: var(--surf-2); }
.prog { height: 6px; background: rgba(255,255,255,.14); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--ac); border-radius: 99px; transition: width .25s; }
.qbody { display: flex; flex-direction: column; gap: 16px; padding-block: 18px 20px; flex: 1; }
.qbody h2 { font-size: clamp(22px, 5.6vw, 28px); font-weight: 900; line-height: 1.2; text-align: center; text-wrap: balance; }
.note { background: var(--paper); border-radius: 24px; min-height: 130px; display: grid; place-items: center; padding: 20px 12px; box-shadow: 0 10px 30px rgba(5,4,40,.35); overflow: hidden; }
.note span { font-family: var(--font); font-weight: 800; letter-spacing: .02em; color: var(--marker); font-size: clamp(40px, 13vw, 64px); line-height: 1.2; white-space: nowrap; }
.note sub { font-size: .6em; vertical-align: -0.2em; }
.note sup { font-size: .55em; vertical-align: 0.8em; margin-left: 1px; }
.ag { display: flex; flex-direction: column; gap: 6px; }
.ag label { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.chips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.chip { min-height: 52px; border-radius: 16px; background: var(--pill); color: var(--pill-ink); font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; display: grid; place-items: center; padding: 0 2px; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.chip.zero { grid-column: span 7; }
.chip:hover:not([disabled]) { background: var(--pill-hover); }
.chip.sel { background: var(--ac); color: var(--ac-ink); }
.chip.correct { background: var(--ok); color: #fff; }
.chip.wrong { background: var(--bad); color: #fff; }
.chip.dim { opacity: .4; }
.chip[disabled] { cursor: default; }
.answers { display: flex; flex-direction: column; gap: 12px; }
.fb { border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; color: var(--card-ink); }
.fb.ok { background: var(--ok-bg); } .fb.no { background: var(--bad-bg); }
.fb b { font-size: 18px; font-weight: 900; }
.fb.ok b { color: var(--ok); } .fb.no b { color: var(--bad); }
.fb p { font-size: 15px; font-weight: 700; }
.fb .eq { font-variant-numeric: tabular-nums; font-weight: 900; }
.bottom { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid rgba(255,255,255,.08); padding-block: 12px 14px; display: flex; gap: 10px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.btn { flex: 1; min-height: 56px; border-radius: 18px; background: var(--ac); color: var(--ac-ink); font-weight: 900; font-size: 17px; }
.btn:hover:not([disabled]) { filter: brightness(1.06); }
.btn[disabled] { opacity: .35; cursor: default; }
.btn.ghost { flex: none; padding: 0 20px; background: var(--surf-2); color: #fff; }

/* Resultat */
.res { display: flex; flex-direction: column; gap: 18px; padding-block: 36px 28px; }
.score { text-align: center; padding-block: 8px; }
.score .big { font-size: 80px; font-weight: 900; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.score .big small { font-size: 28px; color: var(--soft); font-weight: 800; }
.score p { margin-top: 8px; color: var(--soft); font-weight: 800; font-size: 17px; }
.actions { display: flex; flex-direction: column; gap: 10px; }
.actions .btn { flex: none; width: 100%; }
.actions .btn.alt { background: var(--surf-2); color: #fff; }
/* Åbningsanimation */
#splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; cursor: pointer;
  background-color: var(--bg);
  background-image: radial-gradient(70% 40% at 90% 0%, var(--glow-a) 0%, transparent 70%), radial-gradient(60% 40% at 0% 100%, var(--glow-b) 0%, transparent 70%);
  transition: opacity .45s ease, transform .45s ease; }
#splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
.sp-in { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.sp-art { position: relative; width: min(56vw, 250px); }
.sp-flask { display: block; width: 100%; height: auto; overflow: visible; animation: spPop .55s cubic-bezier(.34,1.56,.64,1) both; }
.sp-liq { transform: translateY(150px); animation: spFill 1.05s .25s cubic-bezier(.3,.7,.3,1) forwards; }
.sp-bub { opacity: 0; animation: spBub 1s ease-out both; }
.sp-chip { position: absolute; background: #fff; color: #1B1A4D; font-weight: 900; font-size: 18px; padding: 6px 13px; border-radius: 999px; box-shadow: 0 6px 16px rgba(0,0,0,.3); animation: spChip .5s cubic-bezier(.34,1.56,.64,1) both; font-variant-numeric: tabular-nums; }
.sp-chip.c1 { left: -10%; top: 6%; animation-delay: .95s; }
.sp-chip.c2 { right: -14%; top: 40%; animation-delay: 1.1s; }
.sp-chip.c3 { right: 4%; top: -6%; background: var(--ac); color: var(--ac-ink); animation-delay: 1.25s; }
.sp-title { margin-top: 14px; font-weight: 900; font-size: clamp(32px, 9vw, 46px); letter-spacing: -0.01em; line-height: 1.05; animation: spUp .6s .85s cubic-bezier(.2,.8,.2,1) both; }
.sp-sub { color: var(--soft); font-weight: 700; animation: spUp .6s 1.05s cubic-bezier(.2,.8,.2,1) both; }
@keyframes spPop { from { opacity: 0; transform: scale(.7) translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes spFill { to { transform: translateY(88px); } }
@keyframes spBub { 0% { opacity: 0; transform: translateY(0); } 25% { opacity: .85; } 100% { opacity: 0; transform: translateY(-34px); } }
@keyframes spChip { from { opacity: 0; transform: scale(.3) translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes spUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (max-width: 380px) { .chip { font-size: 13px; min-height: 48px; } }
@media (prefers-reduced-motion: reduce) { .prog i { transition: none; } .screen.enter { animation: none; } .nav .ind { transition: none; } }
</style>

</head>
<body>
<div id="app"></div>
<div id="splash" aria-hidden="true"><div class="sp-in">
  <div class="sp-art">
    <svg class="sp-flask" viewBox="0 0 220 210">
      <defs><clipPath id="spclip"><path d="M92 44h36v44l50 78q8 18-12 18H54q-20 0-12-18l50-78z"/></clipPath></defs>
      <path d="M92 44h36v44l50 78q8 18-12 18H54q-20 0-12-18l50-78z" fill="rgba(255,255,255,.14)"/>
      <g clip-path="url(#spclip)"><rect class="sp-liq" x="30" y="44" width="160" height="150" fill="var(--ac)"/>
        <circle class="sp-bub" cx="104" cy="170" r="6" fill="#fff" style="animation-delay:1s"/>
        <circle class="sp-bub" cx="128" cy="176" r="4" fill="#fff" style="animation-delay:1.2s"/>

        <li><span>Det atom, der trækker mest i elektronerne, får det negative tal.</span></li></ol></div>
    <div class="surf"><h2 class="sec" style="margin:0">Faste tal, der skal sidde</h2>
      <div class="wrap"><table class="tbl"><tr><th>Atom</th><th>Tal</th><th>Undtagelse</th></tr>
      ${fixed.map(r => `<tr><td class="at">${r[0]}</td><td class="ox">${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div></div>
    <div class="surf"><h2 class="sec" style="margin:0">Sådan regner du</h2>
      <ol class="steps"><li><span>Skriv den samlede ladning ned.</span></li><li><span>Sæt de faste tal ind. Husk at gange med antal atomer.</span></li><li><span>Løs for x.</span></li></ol>
      <div class="ex"><small>${fm('MnO4^-')}, find Mn</small>x + 4·(\u2212II) = \u2212I &nbsp;\u2192&nbsp; x = +VII</div>
      <div class="ex"><small>${fm('Cr2O7^2-')}, find Cr</small>2x + 7·(\u2212II) = \u2212II &nbsp;\u2192&nbsp; 2x = +XII &nbsp;\u2192&nbsp; x = +VI</div>
      <div class="ex"><small>${fm('H2SO4')}, find S</small>2·(+I) + x + 4·(\u2212II) = 0 &nbsp;\u2192&nbsp; x = +VI</div>
      <p class="lead">Romertal: I = 1, V = 5, X = 10. Så +VII er +7 og +XII er +12.</p></div>
    <div class="surf"><h2 class="sec" style="margin:0">Største og mindste tal</h2>
      <p class="lead">Højest er antal yderelektroner. Lavest er antal yderelektroner minus 8.</p>
      <div class="wrap"><table class="tbl"><tr><th>Atom</th><th>Yderel.</th><th>Højest</th><th>Lavest</th></tr>
      ${ends.map(r => `<tr><td class="at">${r[0]}</td><td>${r[1]}</td><td class="ox">${r[2]}</td><td class="ox">${r[3]}</td></tr>`).join('')}</table></div>
      <p class="lead">Mangan er en særlig sag: højest +VII.</p></div>
    <div class="surf"><h2 class="sec" style="margin:0">Elektronegativitet</h2>
      <p class="lead">Højeste tal trækker mest i elektronerne og får det negative oxidationstal. H er skillelinjen: Over H får H +I. Under H får H \u2212I.</p>
      <div class="en">${EN.map(r => `<div class="${r[0] === 'H' ? 'h' : ''}"><b>${r[0]}</b><span>${r[1].toFixed(2).replace('.', ',')}</span><i style="width:${r[1] / 3.98 * 100}%"></i></div>`).join('')}</div>
      <p class="lead">${fm('PH3')}: P og H er næsten ens (2,19 og 2,20). Her sætter man P til \u2212III.</p></div>
    <h2 class="sec">Typiske tal pr. grundstof</h2>
    ${TYP.map(e => `<div class="surf"><h3 class="eltitle">${e[0]}<small>${e[1]}</small></h3>${e[2].map(r => `<div class="oxr"><b>${r[0]}</b><span>${fl(r[1])}</span></div>`).join('')}</div>`).join('')}
    <div class="surf"><h2 class="sec" style="margin:0">Oxidation og reduktion</h2>
      <div class="wrap"><table class="tbl"><tr><th></th><th>Oxidationstal</th><th>Elektroner</th></tr>
      <tr><td class="at">Oxidation</td><td class="ox">Stiger</td><td>Afgives</td></tr>
      <tr><td class="at">Reduktion</td><td class="ox">Falder</td><td>Optages</td></tr></table></div>
      <p class="lead">Det stof, der oxideres, er reduktionsmidlet. Det stof, der reduceres, er oxidationsmidlet.</p></div>
    <div class="surf"><h2 class="sec" style="margin:0">Typiske fælder</h2>
      <ul class="tips">
        <li>${fm('H2O2')}: O er \u2212I, ikke \u2212II.</li>
        <li>${fm('NaH')} og ${fm('SiH4')}: H er \u2212I, fordi det andet atom trækker mindre end H.</li>
        <li>${fm('CH4')} giver C \u2212IV, men ${fm('SiH4')} giver Si +IV.</li>
        <li>${fm('OF2')}: O er +II, fordi F vinder over O.</li>
        <li>${fm('Cr2O7^2-')}: Der er <b>to</b> Cr, så regn 2x.</li>
        <li>${fm('S2O3^2-')}: To S, der giver +II hver (gennemsnit).</li>
        <li>Tjek altid ladningen på en ion, før du regner.</li></ul></div>`;
}

function streak() {
  const d = new Date(); let n = 0;
  if (!store.days[dkey(d)]) d.setDate(d.getDate() - 1);
  while (store.days[dkey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function tabOver() {
  const pct = store.ans ? Math.round(100 * store.ok / store.ans) : null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dow = (today.getDay() + 6) % 7;
  const first = new Date(today); first.setDate(first.getDate() - dow - 28);
  let cells = '';
  for (let i = 0; i < 35; i++) {
    const d = new Date(first); d.setDate(first.getDate() + i);
    const k = dkey(d), c = store.days[k] || 0, fut = d > today;
    const lv = fut ? '' : c >= 30 ? 'l4' : c >= 15 ? 'l3' : c >= 5 ? 'l2' : c >= 1 ? 'l1' : '';
    cells += `<button class="${lv}${fut ? ' fut' : ''}${S.hm === k ? ' on' : ''}" ${fut ? 'disabled' : ''} data-a="hm" data-k="${k}" aria-label="${k}: ${c} spørgsmål"></button>`;
  }
  let cap = 'Tryk på en dag for at se, hvor mange spørgsmål du har svaret på.';
  if (S.hm) { const [y, m, dd] = S.hm.split('-').map(Number); const d = new Date(y, m - 1, dd); cap = `${DAG[d.getDay()]} ${dd}. ${MD[m - 1]}: ${store.days[S.hm] || 0} spørgsmål`; }
  const bars = CATS.map(c => {
    const [a, o] = store.cats[c] || [0, 0]; const p = a ? Math.round(100 * o / a) : 0;
    return `<div class="bar-row"><div class="t"><b>${c}</b><span>${a ? p + '% · ' + a : 'ikke øvet'}</span></div><div class="track"><i style="width:${p}%"></i></div></div>`;
  }).join('');
  const wr = store.wrong.slice(-8).reverse().map(id => { const q = QUESTIONS[id]; return `<div class="fix"><div><div class="f">${formulaHtml(q)}</div><div class="s">${NAVN[q.el]} (${q.el})</div></div><div class="a">${lab(q.ans)}</div></div>`; }).join('');
  return `<div class="head"><div><h1>Overblik</h1><p>Din træning indtil nu</p></div></div>
    <div class="stats3">
      <div class="stat"><b>${store.ans}</b><span>Besvaret</span></div>
      <div class="stat"><b>${pct === null ? '–' : pct + '%'}</b><span>Rigtige</span></div>
      <div class="stat"><b>${streak()}</b><span>Dage i træk</span></div>
    </div>
    <div class="surf"><h2 class="sec" style="margin:0">Seneste 5 uger</h2>
      <div class="hm"><i>M</i><i>T</i><i>O</i><i>T</i><i>F</i><i>L</i><i>S</i>${cells}</div>
      <div class="hmcap">${cap}</div></div>
    <div class="surf"><h2 class="sec" style="margin:0">Rigtige pr. emne</h2><div class="bars">${bars}</div></div>
    <div class="surf"><h2 class="sec" style="margin:0">Skal øves</h2>
      ${wr ? `<div class="fixes">${wr}</div><button class="go" data-a="wrong">Øv mine fejl</button>` : '<p class="empty">Ingen fejl at øve. Tag en øvelse eller en prøve, så dukker de op her.</p>'}</div>`;
}

function tabKonto() {
  const skins = [['indigo', 'Indigo', 'linear-gradient(135deg,#4B40B4,#33DDE8)'], ['mint', 'Mint', 'linear-gradient(135deg,#145A70,#7CF2B0)'], ['sunset', 'Solnedgang', 'linear-gradient(135deg,#B8427C,#FFB26B)'], ['neon', 'Neon', 'linear-gradient(135deg,#1B1B26,#C6FF3D)']];
  return `<div class="head"><div><h1>Konto</h1><p>Indstillinger til appen</p></div></div>
    <div class="surf"><h2 class="sec" style="margin:0">Farvetema</h2>
      <div class="skins">${skins.map(s => `<button class="skin ${store.skin === s[0] ? 'on' : ''}" data-a="skin" data-s="${s[0]}"><i style="background:${s[2]}"></i>${s[1]}</button>`).join('')}</div></div>
    <div class="surf"><h2 class="sec" style="margin:0">Menu</h2>
      <p class="note-s" style="margin-top:8px">Hold fingeren på menuen i bunden og træk til siden for at skifte fane.</p></div>
    <div class="surf"><h2 class="sec" style="margin:0">Åbningsanimation</h2>
      <p class="note-s" style="margin-top:8px">Vises, når appen åbnes. Hvis din telefon har slået bevægelser fra, springes den over. Her kan du se den alligevel.</p>
      <button class="danger" data-a="splash">Afspil animationen</button></div>
    <div class="surf"><h2 class="sec" style="margin:0">Data</h2>
      <button class="danger ${S.sure ? 'sure' : ''}" data-a="reset">${S.sure ? 'Tryk igen for at slette alt' : 'Nulstil fremgang'}</button>
      <p class="note-s">Dine tal gemmes kun i denne browser, ikke på en server.</p></div>`;
}

function chip(v, q, pick, revealed) {
  let cls = 'chip' + (v === 0 ? ' zero' : '');
  if (revealed) {
    if (v === q.ans) cls += ' correct'; else if (v === pick) cls += ' wrong'; else cls += ' dim';
  } else if (v === pick) cls += ' sel';
  return `<button class="${cls}" data-a="pick" data-v="${v}" ${revealed ? 'disabled' : ''} aria-label="Oxidationstal ${lab(v)}">${lab(v)}</button>`;
}

function quiz() {
  const q = QUESTIONS[S.qs[S.i]], n = S.qs.length;
  const pick = S.picks[S.i];
  const practice = S.mode === 'practice';
  const revealed = practice && pick !== undefined;
  const done = S.i + (revealed ? 1 : 0);
  const pos = [1,2,3,4,5,6,7], neg = [-1,-2,-3,-4,-5,-6,-7];
  let fb = '';
  if (revealed) {
    const ok = pick === q.ans;
    fb = `<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? 'Rigtigt' : 'Forkert. Rigtigt svar: ' + lab(q.ans)}</b>${explain(q)}</div>`;
  }
  const last = S.i === n - 1;
  return `<div class="stage">
    <div class="qtop">
      <span class="timer">${ICON.clock}<span id="tm">${mmss(Date.now() - S.t0)}</span></span>
      <span class="qnum">${S.tag} · ${S.i + 1} af ${n}</span>
      <button class="x" data-a="home" aria-label="Afslut">${ICON.x}</button>
    </div>
    <div class="prog"><i style="width:${100 * done / n}%"></i></div>
    <div class="qbody">
      <h2>Hvad er oxidationstal for ${elName(q)}?</h2>
      <div class="note"><span>${formulaHtml(q)}</span></div>
      <div class="answers">
        <div class="ag"><div class="chips">${chip(0, q, pick, revealed)}</div></div>
        <div class="ag"><label>Positive</label><div class="chips">${pos.map(v => chip(v, q, pick, revealed)).join('')}</div></div>
        <div class="ag"><label>Negative</label><div class="chips">${neg.map(v => chip(v, q, pick, revealed)).join('')}</div></div>
        ${fb}
      </div>
    </div>
    <div class="bottom">
      ${!practice && S.i > 0 ? '<button class="btn ghost" data-a="prev">Tilbage</button>' : ''}
      <button class="btn" data-a="next" ${pick !== undefined ? '' : 'disabled'}>${last ? 'Se resultat' : 'Næste'}</button>
    </div>
  </div>`;
}

function result() {
  const n = S.qs.length;
  const rows = S.qs.map((id, k) => ({ q: QUESTIONS[id], p: S.picks[k] }));
  const ok = rows.filter(r => r.p === r.q.ans).length;
  const bad = rows.filter(r => r.p !== r.q.ans);
  const pct = Math.round(100 * ok / n);
  const msg = pct === 100 ? 'Alle rigtige' : pct >= 80 ? 'Rigtig godt' : pct >= 50 ? 'Du er på vej' : 'Øv dig lidt mere';
  const wrongHtml = bad.length ? `<div class="surf"><h2 class="sec" style="margin:0">Det gik galt her</h2><div class="fixes">${bad.map(r => `<div class="fix"><div><div class="f">${formulaHtml(r.q)}</div><div class="s">${NAVN[r.q.el]} (${r.q.el})${r.p === undefined ? '' : ' · du svarede ' + lab(r.p)}</div></div><div class="a">${lab(r.q.ans)}</div></div>`).join('')}</div></div>` : '';
  return `<div class="res">
    <div class="score"><div class="big">${ok}<small>/${n}</small></div><p>${msg} · ${pct}% · ${mmss(S.dur || 0)}</p></div>
    ${wrongHtml}
    <div class="actions">
      ${bad.length ? '<button class="btn" data-a="retry">Prøv fejlene igen</button>' : ''}
      <button class="btn alt" data-a="again">Ny runde</button>
      <button class="btn alt" data-a="home">Til forsiden</button>
    </div>
  </div>`;
}

setInterval(() => { const el = document.getElementById('tm'); if (el && S.screen === 'quiz') el.textContent = mmss(Date.now() - S.t0); }, 1000);

/* Klik */
app.addEventListener('click', e => {
  if (Date.now() - noClick < 400 && e.target.closest('.nav')) return;
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (a === 'practice') startPractice();
  else if (a === 'test') startTest();
  else if (a === 'wrong') startWrong();
  else if (a === 'cat') startPractice(b.dataset.c);
  else if (a === 'home') toTabs();
  else if (a === 'tab') setTab(b.dataset.t);
  else if (a === 'hm') { S.hm = S.hm === b.dataset.k ? null : b.dataset.k; render(false); }
  else if (a === 'splash') playSplash(true);
  else if (a === 'skin') { store.skin = b.dataset.s; save(); applySkin(); render(false); }
  else if (a === 'len') { store.len = +b.dataset.n; save(); render(false); }
  else if (a === 'reset') {
    if (!S.sure) { S.sure = true; render(false); }
    else { store = Object.assign(store, { ans: 0, ok: 0, wrong: [], days: {}, cats: {} }); save(); S.sure = false; render(false); }
  }
  else if (a === 'pick') {
    const q = QUESTIONS[S.qs[S.i]];
    if (S.mode === 'practice' && S.picks[S.i] !== undefined) return;
    S.picks[S.i] = +b.dataset.v;
    if (S.mode === 'practice') record(q, S.picks[S.i] === q.ans);
    render(false);
    if (S.mode === 'practice') window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }
  else if (a === 'next') { if (S.i < S.qs.length - 1) { S.i++; render(true); } else finish(); }
  else if (a === 'prev') { if (S.i > 0) { S.i--; render(true); } }
  else if (a === 'retry') {
    const ids = S.qs.filter((id, k) => S.picks[k] !== QUESTIONS[id].ans);
    start('practice', shuffle(ids), 'Fejl');
  }
  else if (a === 'again') { S.tag === 'Prøve' ? startTest() : startPractice(CATS.includes(S.tag) ? S.tag : undefined); }
});

/* Træk mellem faner */
let dg = null, noClick = 0;
app.addEventListener('pointerdown', e => {
  const nv = e.target.closest('.nav'); if (!nv || e.button > 0) return;
  dg = { nv, id: e.pointerId, sx: e.clientX, on: false, hot: TABS.indexOf(S.tab) };
});
app.addEventListener('pointermove', e => {
  if (!dg || e.pointerId !== dg.id) return;
  if (!dg.on) {
    if (Math.abs(e.clientX - dg.sx) < 6) return;
    dg.on = true; try { dg.nv.setPointerCapture(e.pointerId); } catch (er) {}
    dg.nv.classList.add('grab');
    dg.nv.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  }
  const r = dg.nv.getBoundingClientRect(), g = navGeom(dg.nv);
  const left = Math.max(7, Math.min(g.W - 7 - g.w, e.clientX - r.left - g.w / 2));
  dg.nv.querySelector('.ind').style.setProperty('--x', left + 'px');
  const hot = Math.max(0, Math.min(3, Math.round((left - 7) / g.step)));
  if (hot !== dg.hot) { dg.hot = hot; try { if (navigator.vibrate) navigator.vibrate(8); } catch (er) {} }
  dg.nv.querySelectorAll('button').forEach((b, i) => b.classList.toggle('hot', i === hot));
});
const endDg = e => {
  if (!dg || e.pointerId !== dg.id) return;
  const d = dg; dg = null;
  if (!d.on) return;
  noClick = Date.now();
  d.nv.classList.remove('grab');
  const to = TABS[d.hot];
  if (to === S.tab) navSync(); else setTab(to);
};
app.addEventListener('pointerup', endDg);
app.addEventListener('pointercancel', endDg);
window.addEventListener('resize', () => { if (S.screen === 'tabs') navSync(); });
render(false);

/* Åbningsanimation */
const SPLASH_HTML = (document.getElementById('splash') || {}).outerHTML || '';
function playSplash(force) {
  let sp = document.getElementById('splash');
  if (force || !sp) {
    if (sp) sp.remove();
    if (!SPLASH_HTML) return;
    document.body.insertAdjacentHTML('beforeend', SPLASH_HTML);
    sp = document.getElementById('splash');
  }
  if (!force && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { sp.remove(); return; }
  const kill = () => { if (!sp.parentNode || sp.classList.contains('out')) return; sp.classList.add('out'); setTimeout(() => sp.remove(), 500); };
  sp.addEventListener('click', kill);
  setTimeout(kill, 2400);
}
playSplash(false);
</script>
